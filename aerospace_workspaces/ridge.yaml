# Example ridge config for the AeroSpace workspaces bar. Copy the plugin to
# ~/.config/ridge/plugins/aerospace_workspaces/ and this file to
# ~/.config/ridge/ridge.yaml (merge with your own). Requires jq and a Nerd
# Font (bar text); set app_font to an app-icon ligature font for app icons.
bar:
  height: 26
  color: "#1A1B26E6"
  padding_left: 12
  padding_right: 12

items:
  # The workspace pills are created at runtime by the plugin (ids aerospace_ws.*).
  # ridge requires at least one statically-declared item, so we declare a clock.
  - id: clock
    region: right
    type: clock

plugins:
  - name: aerospace_workspaces
    enabled: true
    settings:
      border_focused_color: "#BB9AF7"
      font: "Iosevka Nerd Font"   # bar font (workspace numbers)
