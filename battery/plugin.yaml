name: battery
version: 0.1.0
description: Battery charge-level glyph with threshold color and a details popup
executable: ./battery.sh
autostart: false
restart:
  mode: on-failure
owns: battery.
permissions:
  ops: [add, set, remove, popup]
settings:
  interval: "120"
  region: "right"
  font: "Iosevka Nerd Font"
  warn_threshold: "20"
  crit_threshold: "10"
  warn_color: "theme:warning"
  crit_color: "theme:error"
  normal_color: "theme:primary"
  bg_color: "theme:background"
  corner_radius: ""
  bg_height: ""
settings_schema:
  interval: { type: number, min: 10, max: 600, step: 10 }
  region: { type: enum, options: [left, center, right] }
  font: { type: string }
  warn_threshold: { type: number, min: 1, max: 100, step: 1 }
  crit_threshold: { type: number, min: 1, max: 100, step: 1 }
  warn_color: { type: color }
  crit_color: { type: color }
  normal_color: { type: color }
  bg_color: { type: color }
  corner_radius: { type: number, min: 0, max: 30, step: 1 }
  bg_height: { type: number, min: 16, max: 48, step: 1 }
