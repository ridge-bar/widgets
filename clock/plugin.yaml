name: clock
version: 0.2.0
description: A menu-bar clock; clicking it opens macOS Notification Center
executable: ./clock.sh
autostart: false
restart:
  mode: on-failure
owns: clock.
permissions:
  ops: [add, set, remove]
settings:
  font: "Iosevka Nerd Font"
  time_format: "%H:%M:%S"
  time_interval: "1"
  label_color: "theme:primary"
  bg_color: "theme:background"
  corner_radius: ""
  bg_height: ""
settings_schema:
  font: { type: string }
  time_format: { type: string }
  time_interval: { type: number, min: 1, max: 60, step: 1 }
  label_color: { type: color }
  bg_color: { type: color }
  corner_radius: { type: number, min: 0, max: 30, step: 1 }
  bg_height: { type: number, min: 16, max: 48, step: 1 }
