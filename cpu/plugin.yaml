name: cpu
version: 0.2.0
description: CPU usage bar-block glyph with threshold color and a top-processes popup
executable: ./cpu.sh
autostart: false
restart:
  mode: on-failure
owns: cpu.
permissions:
  ops: [add, set, remove, popup, query]
settings:
  font: "Iosevka Nerd Font"
  interval: "5"
  warn_threshold: "75"
  crit_threshold: "90"
  cpu_color: "theme:system"
  warn_color: "theme:warning"
  crit_color: "theme:error"
  bg_color: "theme:background"
  corner_radius: ""
  bg_height: ""
settings_schema:
  font: { type: string }
  interval: { type: number, min: 1, max: 60, step: 1 }
  warn_threshold: { type: number, min: 1, max: 100, step: 1 }
  crit_threshold: { type: number, min: 1, max: 100, step: 1 }
  cpu_color: { type: color }
  warn_color: { type: color }
  crit_color: { type: color }
  bg_color: { type: color }
  corner_radius: { type: number, min: 0, max: 30, step: 1 }
  bg_height: { type: number, min: 16, max: 48, step: 1 }
