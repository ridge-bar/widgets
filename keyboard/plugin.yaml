name: keyboard
version: 0.2.0
description: Flag emoji for the current macOS keyboard input source (layout)
executable: ./keyboard.sh
autostart: false
restart:
  mode: on-failure
owns: keyboard.
permissions:
  ops: [add, set, remove]
settings:
  interval: "1"
  bg_color: "theme:background"
  corner_radius: ""
  bg_height: ""
settings_schema:
  interval: { type: number, min: 0.5, max: 30, step: 0.5 }
  bg_color: { type: color }
  corner_radius: { type: number, min: 0, max: 30, step: 1 }
  bg_height: { type: number, min: 16, max: 48, step: 1 }
