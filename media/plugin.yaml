name: media
version: 0.2.0
description: Now-playing media controls (title/artist, play/pause/skip/seek) with a details popup
executable: ./media.sh
autostart: false
restart:
  mode: on-failure
owns: media.
permissions:
  ops: [add, set, remove, popup]
settings:
  font: "Iosevka Nerd Font"
  interval: "3"
  show_label: "true"
  label_max_length: "30"
  idle_icon: "󰝚"
  idle_color: "theme:secondary"
  playing_icon: "󰏤"
  playing_icon_color: "theme:primary"
  playing_bg_color: "theme:background"
  paused_icon: "󰐊"
  paused_icon_color: "#12161D"
  paused_bg_color: "theme:warning"
  corner_radius: ""
  bg_height: ""
settings_schema:
  font: { type: string }
  interval: { type: number, min: 1, max: 60, step: 1 }
  show_label: { type: bool }
  label_max_length: { type: number, min: 5, max: 100, step: 1 }
  idle_icon: { type: string }
  idle_color: { type: color }
  playing_icon: { type: string }
  playing_icon_color: { type: color }
  playing_bg_color: { type: color }
  paused_icon: { type: string }
  paused_icon_color: { type: color }
  paused_bg_color: { type: color }
  corner_radius: { type: number, min: 0, max: 30, step: 1 }
  bg_height: { type: number, min: 16, max: 48, step: 1 }
