name: vpn
version: 0.2.0
description: NetBird + Cloudflare WARP connection status, with a connect/disconnect popup, exit-node/vnet selection, and WARP re-auth
executable: ./vpn.sh
autostart: false
restart:
  mode: on-failure
owns: vpn.
permissions:
  ops: [add, set, remove, popup]
settings:
  font: "Iosevka Nerd Font"
  interval: "3"
  netbird_bin: ""
  warp_bin: "/usr/local/bin/warp-cli"
  status_timeout_seconds: "5"
  bg_color: "theme:background"
  connected_color: "theme:success"
  warp_accent_color: "theme:warning"
  netbird_icon_color: "#12161D"
  off_color: "theme:secondary"
  unknown_color: "theme:warning"
  corner_radius: ""
  bg_height: ""
settings_schema:
  font: { type: string }
  interval: { type: number, min: 1, max: 60, step: 1 }
  netbird_bin: { type: string }
  warp_bin: { type: string }
  status_timeout_seconds: { type: number, min: 1, max: 30, step: 1 }
  bg_color: { type: color }
  connected_color: { type: color }
  warp_accent_color: { type: color }
  netbird_icon_color: { type: color }
  off_color: { type: color }
  unknown_color: { type: color }
  corner_radius: { type: number, min: 0, max: 30, step: 1 }
  bg_height: { type: number, min: 16, max: 48, step: 1 }
